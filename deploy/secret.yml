# Replace the placeholders, or render them from your .env:
#   set -a; . ./.env; set +a; envsubst < deploy/secret.yml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: bridge-secrets
  namespace: infomaniak-mcp-bridge
type: Opaque
stringData:
  INFOMANIAK_CLIENT_ID: "${INFOMANIAK_CLIENT_ID}"           # Infomaniak OAuth app (identity only)
  INFOMANIAK_CLIENT_SECRET: "${INFOMANIAK_CLIENT_SECRET}"
  BRIDGE_ENCRYPTION_KEY: "${BRIDGE_ENCRYPTION_KEY}"         # openssl rand -base64 32; encrypts stored API tokens
  REDIS_URL: "${REDIS_URL}"                                 # redis://:password@redis.<namespace>.svc:6379/0
